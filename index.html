<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AxolionTeam Premium Workspace">
    <meta name="theme-color" content="#02060f">
    <title>AxolionTeam | Premium Workspace</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #02060f;
            --bg-navy: #061121;
            --navy-light: #0d1e38;
            --tosca: #00e5ff;
            --tosca-glow: rgba(0, 229, 255, 0.4);
            --black: #000000;
            --white: #ffffff;
            --gray: #8a9bb3;
            --red: #ff3366;
            --green: #00e676;
            --glass-bg: rgba(6, 17, 33, 0.85);
            --glass-border: rgba(0, 229, 255, 0.2);
            --bezier: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--white);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-1 {
            top: -10%;
            left: -10%;
            width: 40vw;
            height: 40vw;
            background: rgba(0, 229, 255, 0.08);
        }

        .bg-glow-2 {
            bottom: -10%;
            right: -10%;
            width: 30vw;
            height: 30vw;
            background: rgba(13, 30, 56, 0.8);
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 280px;
            flex: 0 0 280px;
            background: var(--bg-navy);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 10;
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.5);
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-avatar-wrapper {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            border-radius: 20px;
            background: var(--navy-light);
            padding: 5px;
            box-shadow: 0 0 20px var(--tosca-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .brand-title .highlight {
            color: var(--tosca);
            text-shadow: 0 0 10px var(--tosca-glow);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-btn {
            appearance: none;
            -webkit-appearance: none;
            background: transparent;
            color: var(--gray);
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            text-decoration: none;
            width: 100%;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--white);
        }

        .nav-btn.active {
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.15) 0%, transparent 100%);
            color: var(--tosca);
            border-left: 4px solid var(--tosca);
            text-shadow: 0 0 8px var(--tosca-glow);
        }

        .nav-btn.active i {
            color: var(--tosca);
        }

        .center-stage {
            flex: 1;
            min-width: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }

        .glass-container {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .view-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            overflow-y: auto;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .view-panel.active {
            display: block;
            opacity: 1;
        }

        .view-panel h2 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--white);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .view-panel h2 i {
            color: var(--tosca);
        }

        .hero-section {
            text-align: center;
            margin-top: 10vh;
        }

        .premium-card {
            background: linear-gradient(145deg, rgba(13, 30, 56, 0.9), rgba(6, 17, 33, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            margin-top: 10px;
        }

        .premium-btn {
            background: var(--tosca);
            color: var(--black);
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .premium-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px var(--tosca-glow);
        }

        .custom-input-group {
            position: relative;
            margin-top: 15px;
        }

        .custom-input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tosca);
        }

        .custom-input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .custom-input-group input:focus {
            border-color: var(--tosca);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.08);
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .stat-box {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-weight: 600;
        }

        .editor-wrapper {
            background: #0b101e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 15px;
        }

        .editor-tab {
            background: #16243d;
            padding: 10px 20px;
            font-family: monospace;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            color: var(--tosca);
        }

        #lua-textarea {
            width: 100%;
            height: 250px;
            background: transparent;
            color: #a9c2ff;
            padding: 20px;
            border: none;
            outline: none;
            font-family: 'Consolas', monospace;
            resize: none;
            font-size: 14px;
        }

        .console-box {
            background: #000;
            padding: 15px;
            border-top: 1px solid #222;
            font-family: monospace;
            color: #fff;
            min-height: 80px;
        }

        .text-tosca {
            color: var(--tosca);
        }

        .text-green {
            color: var(--green);
        }

        .text-red {
            color: var(--red);
        }

        .route-status {
            position: fixed;
            bottom: 12px;
            right: 14px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            pointer-events: none;
            z-index: 999;
        }

        @media (max-width: 850px) {
            .sidebar {
                width: 210px;
                flex-basis: 210px;
                padding: 20px 12px;
            }

            .nav-btn {
                padding: 13px 12px;
                font-size: 0.9rem;
            }

            .center-stage {
                padding: 15px;
            }

            .glass-container {
                height: calc(100vh - 30px);
                border-radius: 18px;
            }

            .view-panel {
                padding: 25px;
            }

            .view-panel h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .app-layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                flex: 0 0 auto;
                height: auto;
                padding: 10px;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
            }

            .sidebar-header {
                display: none;
            }

            .nav-menu {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }

            .nav-btn {
                justify-content: center;
                padding: 10px 6px;
                font-size: 0.75rem;
                gap: 6px;
                border-left: none !important;
                border-bottom: 3px solid transparent;
            }

            .nav-btn.active {
                border-bottom-color: var(--tosca);
            }

            .center-stage {
                padding: 10px;
                align-items: stretch;
            }

            .glass-container {
                height: calc(100vh - 80px);
                border-radius: 16px;
            }

            .view-panel {
                padding: 20px;
            }

            .view-panel h2 {
                font-size: 1.25rem;
            }

            .hero-section {
                margin-top: 8vh;
            }
        }
    </style>
</head>

<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-avatar-wrapper">
                    <i class="fas fa-cube text-tosca" style="font-size: 2.5rem;"></i>
                </div>
                <h1 class="brand-title">AXOLION<span class="highlight">TEAM</span></h1>
            </div>

            <nav class="nav-menu" aria-label="Navigasi utama">
                <a class="nav-btn active" href="/" data-target="dashboard" aria-current="page">
                    <i class="fas fa-layer-group"></i>
                    <span>Dashboard</span>
                </a>

                <a class="nav-btn" href="/lua-editor" data-target="lua-editor">
                    <i class="fas fa-code"></i>
                    <span>Lua Editor</span>
                </a>

                <a class="nav-btn" href="/calculator" data-target="calculator">
                    <i class="fas fa-chart-line"></i>
                    <span>Robux Calc</span>
                </a>
            </nav>
        </aside>

        <main class="center-stage">
            <div class="glass-container">
                <section id="dashboard" class="view-panel active">
                    <div class="hero-section">
                        <h2>Next-Gen Workspace Active</h2>
                        <p style="color: var(--gray)">
                            Pilih menu di samping untuk mulai menggunakan fitur.
                        </p>
                    </div>
                </section>

                <section id="lua-editor" class="view-panel">
                    <h2><i class="fas fa-code"></i> Lua Project Workspace</h2>

                    <button class="premium-btn" id="run-lua-btn" type="button">
                        <i class="fas fa-play"></i>
                        Compile &amp; Run
                    </button>

                    <div class="editor-wrapper">
                        <div class="editor-tab">main.lua</div>

                        <textarea id="lua-textarea" spellcheck="false">print("AxolionTeam Script Loaded Successfully!")</textarea>

                        <div class="console-box" id="lua-console">
                            <span class="text-tosca">AxolionTerminal v1.0.0</span><br>
                            &gt; Ready for execution...
                        </div>
                    </div>
                </section>

                <section id="calculator" class="view-panel">
                    <h2><i class="fas fa-chart-line"></i> Robux Tax Calculator</h2>

                    <div class="premium-card">
                        <div class="custom-input-group">
                            <i class="fas fa-coins"></i>
                            <input
                                type="number"
                                id="robux-input"
                                min="0"
                                step="1"
                                inputmode="numeric"
                                placeholder="Masukkan jumlah Robux..."
                                aria-label="Jumlah Robux"
                            >
                        </div>

                        <div class="stats-grid">
                            <div class="stat-box">
                                <span style="color: var(--gray)">Tax (30%)</span>
                                <span id="tax-amount" class="text-red">0 R$</span>
                            </div>

                            <div class="stat-box">
                                <span style="color: var(--gray)">Net (70%)</span>
                                <span id="net-amount" class="text-green">0 R$</span>
                            </div>

                            <div class="stat-box" style="border: 1px solid var(--tosca)">
                                <span style="color: var(--gray)">DevEx (USD)</span>
                                <span id="devex-amount" class="text-tosca">$0.00 USD</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="route-status" id="route-status" aria-hidden="true"></div>

    <script>
        (() => {
            'use strict';

            /*
             * AXOLIONTEAM ROUTER
             * ------------------
             * /              -> Dashboard
             * /lua-editor    -> Lua Editor
             * /calculator    -> Robux Calculator
             *
             * Uses History API so navigation changes the URL without
             * reloading the page. Vercel rewrites these routes to index.html.
             */

            const routes = Object.freeze({
                '/': 'dashboard',
                '/index.html': 'dashboard',
                '/lua-editor': 'lua-editor',
                '/lua-editor/': 'lua-editor',
                '/calculator': 'calculator',
                '/calculator/': 'calculator'
            });

            const routeForPanel = Object.freeze({
                'dashboard': '/',
                'lua-editor': '/lua-editor',
                'calculator': '/calculator'
            });

            const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
            const panels = Array.from(document.querySelectorAll('.view-panel'));

            function normalizePath(pathname) {
                if (!pathname) return '/';

                let clean = pathname
                    .replace(/\\/g, '/')
                    .replace(/\/+/g, '/');

                if (clean.length > 1) {
                    clean = clean.replace(/\/+$/, '');
                }

                return clean || '/';
            }

            function getPanelFromPath() {
                const path = normalizePath(window.location.pathname);
                return routes[path] || 'dashboard';
            }

            function getUrlForPanel(panelId) {
                return routeForPanel[panelId] || '/';
            }

            function updateActiveNavigation(panelId) {
                navButtons.forEach((btn) => {
                    const isActive = btn.dataset.target === panelId;

                    btn.classList.toggle('active', isActive);

                    if (isActive) {
                        btn.setAttribute('aria-current', 'page');
                    } else {
                        btn.removeAttribute('aria-current');
                    }
                });
            }

            function updateActivePanel(panelId) {
                panels.forEach((panel) => {
                    panel.classList.toggle('active', panel.id === panelId);
                });
            }

            function showPanel(panelId, options = {}) {
                const { updateUrl = false, replaceUrl = false } = options;

                const safePanelId = document.getElementById(panelId)
                    ? panelId
                    : 'dashboard';

                updateActiveNavigation(safePanelId);
                updateActivePanel(safePanelId);

                const targetUrl = getUrlForPanel(safePanelId);
                const currentUrl = normalizePath(window.location.pathname);

                if (updateUrl && currentUrl !== targetUrl) {
                    const historyState = { axolionPanel: safePanelId };

                    if (replaceUrl) {
                        window.history.replaceState(historyState, '', targetUrl);
                    } else {
                        window.history.pushState(historyState, '', targetUrl);
                    }
                }

                const routeStatus = document.getElementById('route-status');
                if (routeStatus) {
                    routeStatus.textContent = targetUrl;
                }

                return safePanelId;
            }

            // Keep href values correct even if the markup is later changed.
            navButtons.forEach((btn) => {
                const target = btn.dataset.target;
                if (target && routeForPanel[target]) {
                    btn.setAttribute('href', routeForPanel[target]);
                }
            });

            // Initial route.
            showPanel(getPanelFromPath());

            // SPA navigation.
            document.addEventListener('click', (event) => {
                const btn = event.target.closest('.nav-btn');
                if (!btn) return;

                // Preserve normal browser behavior for new-tab, new-window,
                // modifier-clicks, middle click, or an already handled event.
                if (
                    event.defaultPrevented ||
                    event.button !== 0 ||
                    event.metaKey ||
                    event.ctrlKey ||
                    event.shiftKey ||
                    event.altKey
                ) {
                    return;
                }

                const target = btn.dataset.target;
                if (!target) return;

                event.preventDefault();
                showPanel(target, { updateUrl: true });
            });

            // Browser Back / Forward.
            window.addEventListener('popstate', () => {
                showPanel(getPanelFromPath());
            });

            // If a browser restores the page from bfcache, re-sync the route.
            window.addEventListener('pageshow', () => {
                showPanel(getPanelFromPath());
            });
        })();

        // Kalkulator Robux
        const robuxInput = document.getElementById('robux-input');

        if (robuxInput) {
            robuxInput.addEventListener('input', (event) => {
                let val = parseInt(event.target.value, 10) || 0;

                if (val < 0) val = 0;

                const tax = Math.floor(val * 0.3);
                const net = val - tax;
                const devex = (net * 0.0035).toFixed(2);

                document.getElementById('tax-amount').innerText = `- ${tax} R$`;
                document.getElementById('net-amount').innerText = `${net} R$`;
                document.getElementById('devex-amount').innerText = `$${devex} USD`;
            });
        }

        // Tombol Lua Compiler
        const runLuaBtn = document.getElementById('run-lua-btn');

        if (runLuaBtn) {
            runLuaBtn.addEventListener('click', () => {
                const consoleBox = document.getElementById('lua-console');
                const textarea = document.getElementById('lua-textarea');

                if (!consoleBox) return;

                const code = textarea ? textarea.value.trim() : '';

                if (!code) {
                    consoleBox.innerHTML = `
                        <span class="text-tosca">AxolionTerminal v1.0.0</span><br>
                        &gt; <span class="text-red">[ERROR] Editor kosong.</span>
                    `;
                    return;
                }

                consoleBox.innerHTML = `
                    <span class="text-tosca">AxolionTerminal v1.0.0</span><br>
                    &gt; Compiling code structure...<br>
                    &gt; <span class="text-green">[SUCCESS] Skrip berhasil dieksekusi tanpa error!</span>
                `;
            });
        }
    </script>
</body>
</html>
